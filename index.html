<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16651f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Straßenfest">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <title>Straßenfest</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🍖</div>
        <div class="brand-copy">
          <strong>Straßenfest</strong>
          <small id="appStatus">wird geladen …</small>
        </div>
      </div>
      <button class="icon-button" id="reloadBtn" type="button" aria-label="App neu laden">🔄</button>
    </header>

    <main class="stage">
      <section class="loader" id="loader">
        <div class="loader-card">
          <div class="loader-icon">🍖🍺</div>
          <h1>Straßenfest wird geladen …</h1>
          <p>Die App ist gleich bereit.</p>
          <div class="loader-bar"><span></span></div>
          <div class="loader-note" id="loaderNote">Verbindung wird hergestellt.</div>
        </div>
      </section>

      <iframe id="appFrame"
              title="Straßenfest App"
              allow="fullscreen"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>
  </div>

  <script src="js/cleanup.js"></script>
  <script src="config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
